name = "dental-canvas"
main = "src/server/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Serve the Vite build as static assets (SPA fallback to index.html), with the
# Hono API and the @clawnify discovery routes handled by the Worker script.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/llms.txt"]

[[d1_databases]]
binding = "DB"
database_name = "dental-canvas-db"
database_id = "local"
