[package]
name = "dental-canvas"
version = "1.4.16"
description = "Dental Canvas - Chamber Management System"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
default-run = "dental-canvas"

[lib]
# The cdylib target is what the Android build links into the APK; the crate
# is consumed as `dental_canvas::run()` from main.rs on desktop. Adding a lib
# target does not change the desktop binaries.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target."cfg(any(target_os = \"macos\", target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
