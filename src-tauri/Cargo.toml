[package]
name = "dental-canvas"
version = "1.4.27"
description = "Dental Canvas - Chamber Management System"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
default-run = "dental-canvas"

[lib]
# The cdylib target is what the Android build links into the APK; the crate
# is consumed as `dental_canvas::run()` from main.rs on desktop. Adding a lib
# target does not change the desktop binaries.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

# Reproducible release binaries: incremental caches embed timestamps, and
# parallel codegen units let two builds of the same commit lay code out
# differently. Both are disabled for releases, and scripts/repro-env.sh remaps
# the build directory so panic locations carry no absolute paths.
# Symbols are left intact — some platforms load the crate's exported JNI
# entry points by name.
[profile.release]
codegen-units = 1
incremental = false

[target."cfg(any(target_os = \"macos\", target_os = \"windows\", target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# "Launch at login" (Settings → Appearance → Startup). Registers a Run key on
# Windows, a LaunchAgent on macOS and an XDG autostart entry on Linux. Desktop
# only, like the updater above.
tauri-plugin-autostart = "2"
