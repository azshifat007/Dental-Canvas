<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dental Canvas</title>
  <meta name="description" content="Open-source dental practice management — scheduling, patient charts, treatment planning, clinical notes, and billing.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Apply the theme before first paint to avoid a light/dark flash.
    // Mirrors src/client/hooks/use-theme.ts — keep the two in sync.
    (function () {
      try {
        var pref = localStorage.getItem("dental-canvas:theme");
        var dark =
          pref === "dark" ||
          (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {
        /* no storage — fall back to system */
        document.documentElement.classList.toggle(
          "dark",
          matchMedia("(prefers-color-scheme: dark)").matches
        );
      }
      // Accessibility preferences — same no-flash contract.
      // Mirrors src/client/hooks/use-accessibility.ts — keep the two in sync.
      try {
        var contrast = localStorage.getItem("dental-canvas:contrast");
        var motion = localStorage.getItem("dental-canvas:reduced-motion");
        var wantsContrast =
          contrast === "on" ||
          (contrast !== "off" && matchMedia("(prefers-contrast: more)").matches);
        var wantsReducedMotion =
          motion === "on" ||
          (motion !== "off" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.classList.toggle("a11y-contrast", wantsContrast);
        document.documentElement.classList.toggle("a11y-reduce-motion", wantsReducedMotion);
      } catch (e) {
        /* no storage — accessibility falls back to system */
        document.documentElement.classList.toggle(
          "a11y-contrast",
          matchMedia("(prefers-contrast: more)").matches
        );
        document.documentElement.classList.toggle(
          "a11y-reduce-motion",
          matchMedia("(prefers-reduced-motion: reduce)").matches
        );
      }
      // Brand accent color — same no-flash contract.
      // Mirrors src/client/hooks/use-brand-accent.ts — keep the two in sync.
      try {
        var accent = localStorage.getItem("dental-canvas:accent");
        var hex = accent && accent.replace("#", "");
        if (hex && /^[0-9a-fA-F]{6}$/.test(hex)) {
          var s = hex;
          var r = parseInt(s.slice(0, 2), 16) / 255;
          var g = parseInt(s.slice(2, 4), 16) / 255;
          var b = parseInt(s.slice(4, 6), 16) / 255;
          var lin = function (c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
          r = lin(r); g = lin(g); b = lin(b);
          var l_ = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
          var m_ = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
          var s_ = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
          var a = 1.9779984951 * l_ - 2.428592205 * m_ + 0.4505937099 * s_;
          var b2 = 0.0259040371 * l_ + 0.7827717662 * m_ - 0.808675766 * s_;
          var C = Math.sqrt(a * a + b2 * b2);
          var H = Math.atan2(b2, a) * 180 / Math.PI;
          if (H < 0) H += 360;
          if (C >= 0.02) {
            document.documentElement.style.setProperty("--brand-hue", String(Math.round(H) % 360));
            document.documentElement.style.setProperty("--brand-chroma-scale", String(Math.min(1.35, Math.max(0.35, Math.round((C / 0.2) * 100) / 100))));
          }
        }
      } catch (e) { /* no storage — default teal */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/client/main.tsx"></script>
</body>
</html>
