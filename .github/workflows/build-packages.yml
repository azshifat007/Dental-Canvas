name: Build desktop & mobile packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows NSIS installer (+ updater artifacts) ────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version (v$version)."
          }
          # Windows runners check files out with CRLF (core.autocrlf), so
          # the line-end must tolerate an optional \r or the check false-fails.
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch ('(?m)^version = "' + [regex]::Escape($version) + '"\r?$')) {
            throw 'Cargo.toml version must match package.json.'
          }

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle (.sig) for the in-app updater. The public
          # half is embedded in the app (tauri.conf.json plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Download the Dental Canvas installer for your platform below.

            - **Windows** — `...-setup.exe` (NSIS installer, x64)
            - **Linux** — `..._amd64.deb`, `..._x86_64.rpm`, `..._amd64.AppImage`
            - **Android** — `...-universal.apk` (sideload; enable "install unknown apps")

            These releases package the full offline app — UI and the local backend are both bundled, so the clinic can run entirely without internet. Installers are not code-signed.

            See README.md for setup and limitations.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Generate latest.json for the in-app updater (endpoints in
          # tauri.conf.json point at releases/latest/download/latest.json) and
          # prefer the NSIS setup.exe (the only bundle we ship) as the payload.
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

  # ── Linux desktop packages (deb / rpm / AppImage) ───────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # libayatana-appindicator3-dev conflicts with the legacy
      # libappindicator3-dev — only the ayatana one may be installed.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Build Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Linux desktop packages. `.deb` for Debian/Ubuntu, `.rpm` for
            Fedora/openSUSE, `.AppImage` for everything else.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles deb,rpm,appimage

  # ── Android APK ─────────────────────────────────────────────────────
  # Produces a SIGNED universal APK for sideloading on tablets/phones.
  # GitHub runners ship the Android SDK + NDK preinstalled; tauri android
  # init generates the Gradle project. Signing uses TAURI_ANDROID_KEYSTORE
  # (base64 .jks) + TAURI_ANDROID_KEYSTORE_PASSWORD + TAURI_ANDROID_KEY_ALIAS
  # secrets when present; otherwise a throwaway release keystore is generated
  # in-workflow (fine for sideloading — just not for Play Store updates).
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init || true

      - name: Configure signing
        id: signing
        env:
          KS_B64: ${{ secrets.TAURI_ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.TAURI_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore.jks
            echo "pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "alias=$KS_ALIAS" >> "$GITHUB_OUTPUT"
            echo "signing=secret-keystore" >> "$GITHUB_ENV"
          else
            # Throwaway keystore so the APK is at least installable. Regenerated
            # every release — devices see it as a NEW app on each major update.
            keytool -genkeypair -v -keystore keystore.jks -alias dental-canvas \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass dental-canvas-ci -keypass dental-canvas-ci \
              -dname "CN=Dental Canvas, OU=CI, O=Dental Canvas, C=BD"
            echo "pass=dental-canvas-ci" >> "$GITHUB_OUTPUT"
            echo "alias=dental-canvas" >> "$GITHUB_OUTPUT"
            echo "signing=ephemeral-keystore" >> "$GITHUB_ENV"
          fi

      # Inject the signing values straight into build.gradle.kts — no
      # properties indirection (java.util is shadowed by the `java` extension
      # inside .kts and imports are only legal at the top of the file).
      - name: Wire signing into the Gradle project
        env:
          KS_PATH: ${{ github.workspace }}/keystore.jks
          KS_PASS: ${{ steps.signing.outputs.pass }}
          KS_ALIAS: ${{ steps.signing.outputs.alias }}
        run: |
          python3 - <<PY
          import re
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          if "dentalCanvasSigning" not in s:
            inject = '''android {
            signingConfigs {
              create("dentalCanvasSigning") {
                storeFile = file("$KS_PATH")
                storePassword = "$KS_PASS"
                keyAlias = "$KS_ALIAS"
                keyPassword = "$KS_PASS"
              }
            }
          '''
            s = s.replace("android {", inject, 1)
            s = re.sub(
              r"(buildTypes \{\s*getByName\(\"release\"\) \{)",
              r'\1\n            signingConfig = signingConfigs.getByName("dentalCanvasSigning")',
              s,
              count=1,
            )
            open(p, "w").write(s)
            print("signing wired")
          else:
            print("already wired")
          PY

      - name: Build Android APK (signed)
        run: pnpm tauri android build --apk

      - name: Verify the APK is signed
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/*/apksigner verify --print-certs "$apk" | head -5

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        env:
          # The action does NOT read the automatic GITHUB_TOKEN unless it is
          # passed explicitly — without it every API call is unauthenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          tag_name: ${{ github.ref_name }}
