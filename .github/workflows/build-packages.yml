name: Build desktop & mobile packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Windows NSIS installer (+ updater artifacts) ────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version (v$version)."
          }
          # Windows runners check files out with CRLF (core.autocrlf), so
          # the line-end must tolerate an optional \r or the check false-fails.
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch ('(?m)^version = "' + [regex]::Escape($version) + '"\r?$')) {
            throw 'Cargo.toml version must match package.json.'
          }

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle (.sig) for the in-app updater. The public
          # half is embedded in the app (tauri.conf.json plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Download the Dental Canvas installer for your platform below.

            - **Windows** — `...-setup.exe` (NSIS installer, x64)
            - **Linux** — `..._amd64.deb`, `..._x86_64.rpm`, `..._amd64.AppImage`
            - **macOS** — `..._aarch64.appdmg` (Apple Silicon) — unsigned: right-click → Open on first launch
            - **Android** — `...-universal.apk` (sideload; enable "install unknown apps")

            These releases package the full offline app — UI and the local backend are both bundled, so the clinic can run entirely without internet. Installers are not code-signed.

            See README.md for setup and limitations.
          # Draft until the verify-and-publish job has checked every package's
          # embedded frontend; it flips the release live on success.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Generate latest.json for the in-app updater (endpoints in
          # tauri.conf.json point at releases/latest/download/latest.json) and
          # prefer the NSIS setup.exe (the only bundle we ship) as the payload.
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

  # ── Linux desktop packages (deb / rpm / AppImage) ───────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # libayatana-appindicator3-dev conflicts with the legacy
      # libappindicator3-dev — only the ayatana one may be installed.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Build Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Linux desktop packages. `.deb` for Debian/Ubuntu, `.rpm` for
            Fedora/openSUSE, `.AppImage` for everything else.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles deb,rpm,appimage

  # ── macOS DMG (Apple Silicon) ───────────────────────────────────────
  # Unsigned DMG for now — macOS Gatekeeper requires right-click → Open
  # (or xattr -cr) on first launch. Ad-hoc signing keeps the binary valid
  # locally; a Developer ID certificate can be added later for notarization.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Build and publish macOS DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            macOS DMG (Apple Silicon). Unsigned — on first launch right-click
            the app and choose Open, or run `xattr -cr /Applications/Dental\ Canvas.app`.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --bundles dmg

  # ── Android APK ─────────────────────────────────────────────────────
  # Produces a SIGNED universal APK for sideloading on tablets/phones.
  # GitHub runners ship the Android SDK + NDK preinstalled; tauri android
  # init generates the Gradle project. Signing uses TAURI_ANDROID_KEYSTORE
  # (base64 .jks) + TAURI_ANDROID_KEYSTORE_PASSWORD + TAURI_ANDROID_KEY_ALIAS
  # secrets when present; otherwise a throwaway release keystore is generated
  # in-workflow (fine for sideloading — just not for Play Store updates).
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init || true

      - name: Configure signing
        env:
          KS_B64: ${{ secrets.TAURI_ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.TAURI_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > keystore.jks
            alias="$KS_ALIAS"
            pass="$KS_PASS"
            echo "signing=secret-keystore" >> "$GITHUB_ENV"
          else
            # Throwaway keystore so the APK is at least installable. Regenerated
            # every release — devices treat each release as a NEW app, so this
            # is for testing only; set the TAURI_ANDROID_KEYSTORE secrets for a
            # stable signature across releases.
            keytool -genkeypair -v -keystore keystore.jks -alias dental-canvas \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass dental-canvas-ci -keypass dental-canvas-ci \
              -dname "CN=Dental Canvas, OU=CI, O=Dental Canvas, C=BD"
            alias="dental-canvas"
            pass="dental-canvas-ci"
            echo "signing=ephemeral-keystore" >> "$GITHUB_ENV"
          fi
          # keystore.properties at the ANDROID PROJECT ROOT, with the exact
          # keys the official Tauri signing flow expects.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$pass
          keyAlias=$alias
          storeFile=${GITHUB_WORKSPACE}/keystore.jks
          EOF

      # Wire the signing config into build.gradle.kts per the official Tauri
      # Android signing guide: imports at the very TOP of the file (the only
      # legal position), a release signingConfigs block before buildTypes, and
      # signingConfig set inside buildTypes.release. Every replacement asserts
      # so a silent no-match can never produce an unsigned APK again.
      - name: Wire signing into the Gradle project
        run: |
          python3 - <<'PY'
          import re, sys
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          marker = "dental-canvas-ci-signing"
          if marker in s:
            print("already wired")
            sys.exit(0)
          # The template already imports Properties but not FileInputStream —
          # ensure each import individually (imports must sit above all
          # declarations; prepending to the file top is always valid).
          for imp in ("import java.util.Properties", "import java.io.FileInputStream"):
            if imp not in s:
              s = imp + "\n" + s
          block = '''// dental-canvas-ci-signing
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }

          '''
          s2 = s.replace("buildTypes {", block + "buildTypes {", 1)
          assert s2 != s, "buildTypes block not found in build.gradle.kts"
          s = s2
          # Match `getByName("release") {` directly — the buildTypes-wide
          # regex could not cross the debug block's closing brace. Asserts
          # the one release build type exists and injects into it.
          s2, n = re.subn(
            r"""getByName\((?:'|\")release(?:'|\")\)\s*\{""",
            'getByName("release") {\\n            signingConfig = signingConfigs.getByName("release")',
            s,
            count=1,
          )
          assert n == 1, "buildTypes.release block not found in build.gradle.kts"
          open(p, "w").write(s2)
          print("signing wired with assertions")
          PY

      - name: Build Android APK (signed)
        run: pnpm tauri android build --apk

      - name: Rename the signed APK
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release
          for f in *-unsigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f/-unsigned/}"
          done
          ls -la

      - name: Verify the APK is signed
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then echo "apksigner not found" >&2; exit 1; fi
          "$apksigner" verify --print-certs "$apk"
          # Belt and braces: an APK without the v2/v3 signing block cannot
          # install on modern Android regardless of what apksigner says.
          python3 -c "
          import sys
          data = open(sys.argv[1], 'rb').read()
          sys.exit(0 if b'APK Sig Block 42' in data else 1)
          " "$apk"
          echo "signature block verified"

      # Plain asset upload to the release the Windows job created — avoids
      # action-gh-release's update-release flow, which the GITHUB_TOKEN may
      # not be allowed to perform on existing releases.
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
            --clobber --repo "${GITHUB_REPOSITORY}"

  # ── Android boot smoke test ─────────────────────────────────────────
  # The v1.4.11 APK installed fine but EVERY boot died in the service-worker
  # path — no package inspection can catch that, only launching the app can.
  # This job builds a debug APK, boots an emulator, and runs the in-tree
  # instrumented test (tests/android) asserting the WebView mounts past
  # boot (not the "could not start" fatal screen). The verify-and-publish
  # job waits for it, so a non-booting APK can never ship.
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init || true

      # The Gradle project is generated by `tauri android init` (gitignored),
      # so the in-tree test source + its dependencies are injected here.
      # testInstrumentationRunner is already set by the Tauri template.
      - name: Inject the boot smoke test into the Gradle project
        run: |
          set -e
          app=src-tauri/gen/android/app
          mkdir -p "$app/src/androidTest/java/com/dentalcanvas/app"
          cp tests/android/src/androidTest/java/com/dentalcanvas/app/BootSmokeTest.kt \
             "$app/src/androidTest/java/com/dentalcanvas/app/BootSmokeTest.kt"
          python3 - <<'PY'
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          marker = "dental-canvas-boot-smoke-deps"
          if marker not in s:
              block = '''// dental-canvas-boot-smoke-deps
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("androidx.test.uiautomator:uiautomator:2.3.0")
              androidTestImplementation("androidx.test:runner:1.6.2")
              '''
              anchor = "dependencies {"
              assert anchor in s, "dependencies block not found in build.gradle.kts"
              s = s.replace(anchor, anchor + "\n" + block, 1)
              open(p, "w").write(s)
              print("smoke deps injected")
          else:
              print("already injected")
          PY

      - name: Build debug APK (with tests)
        run: pnpm tauri android build --debug --apk

      # Without this the runner user cannot open /dev/kvm, and the emulator
      # falls back to pure software emulation: boot took 394 s and adb stayed
      # flaky ("device offline" / "Broken pipe") until the job timed out.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [ -e /dev/kvm ] && echo "KVM available" || { echo "::error::/dev/kvm not present"; exit 1; }

      - name: Run boot smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # hw-accel must stay ON (KVM); software accel is what wedged the
          # previous run.
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # NOTE: this action executes EACH LINE of `script` via a separate
          # `sh -c`, so shell variables do not survive across lines. Use
          # single-line commands (or && chains) only.
          script: |
            adb install -r src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            adb shell am instrument -w -e class com.dentalcanvas.app.BootSmokeTest com.dentalcanvas.app.test/androidx.test.runner.AndroidJUnitRunner

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          adb logcat -d > boot-smoke-logcat.txt || true
          adb shell uiautomator dump /sdcard/window_dump.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window_dump.xml . >/dev/null 2>&1 || true
          ls -la

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-diagnostics
          path: |
            boot-smoke-logcat.txt
            window_dump.xml
          if-no-files-found: ignore

  # ── Verify & publish ────────────────────────────────────────────────────────────
  # The stale-UI incident (v1.4.4: an installer that silently shipped an old
  # frontend) is only catchable by opening the packages and comparing. Every
  # build job above creates a DRAFT release; this job extracts each desktop
  # package and asserts the embedded frontend hashes match a fresh build of
  # the tagged commit, then flips the release live. A bad package can never
  # reach users.
  verify-and-publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-android, android-smoke]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # binutils provides ar, p7zip-full provides 7z — both are shellouts of
      # scripts/verify_embedded_frontend.py.
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils

      - name: Build the reference frontend
        run: |
          npm run build
          echo "Reference build entry chunk: $(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify
          gh release download "${GITHUB_REF_NAME}" --dir verify --clobber \
            --repo "${GITHUB_REPOSITORY}"
          ls -la verify

      - name: Verify embedded frontend in every published package
        run: |
          python3 scripts/verify_embedded_frontend.py \
            --dist dist \
            --package verify/*-setup.exe \
            --package verify/*.deb \
            --package verify/*.rpm \
            --package verify/*.AppImage \
            --package verify/*.dmg \
            --package verify/*.apk

      - name: Verify updater feed
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("verify/latest.json") as f:
              feed = json.load(f)
          version = os.environ["EXPECTED_VERSION"].lstrip("v")
          assert feed["version"] == version, f"latest.json version {feed['version']} != {version}"
          for plat in ("windows-x86_64", "linux-x86_64"):
              assert plat in feed["platforms"], f"latest.json missing {plat}"
              assert "signature" in feed["platforms"][plat], f"{plat} missing updater signature"
          print("latest.json OK:", feed["version"], sorted(feed["platforms"]))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
          echo "Release ${GITHUB_REF_NAME} published"
