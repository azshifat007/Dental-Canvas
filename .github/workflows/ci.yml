name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo ships a pnpm lockfile only — `npm ci` would fail outright
      # (no package-lock.json), which is why this workflow used to be a draft.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite resolves .js before .ts/.tsx, so a stray compiled file next to a
      # source silently replaces it (the medicines scroll fix shipped four
      # times as a no-op this way). Fail fast, before the build.
      - name: sources are not shadowed by compiled .js
        run: node scripts/check-shadowed-sources.mjs

      - name: typecheck
        run: pnpm exec tsc --noEmit

      - name: build
        run: pnpm run build

      # The built stylesheet must match the class set the last release shipped
      # (scripts/stylesheet-classes.txt). A class that appears without anyone
      # writing it means the scan reached files it should not — an extracted
      # package tree, a scratch file inside src/, a widened @source root — and
      # it would ship silently otherwise, changing the CSS hash and rootHash.
      # `pnpm run build` runs the same guard, so a local build fails too; this
      # step makes the result a named CI check instead of build-log tail.
      - name: stylesheet classes match the last release
        run: pnpm run lint:classes

      # Required, not continue-on-error: the suite is green (271 tests) and a
      # red suite must block the push like any other failure.
      - name: tests
        run: pnpm test

      # Fast, read-only assertions over the build output this job just built:
      # the prescription print route and the two-column template must survive
      # into dist (they are runtime-selected, so bundler pruning is the risk).
      - name: verify print template in build output
        run: node scripts/verify-two-column-ci.mjs

  # ── Tauri plugin pairing ─────────────────────────────────────────────────
  # The Tauri CLI rejects a desktop build whose Rust plugin crate and JS
  # wrapper sit on different major.minor versions, and nothing checked that
  # before a tag. v1.4.24's first release run died in all five package jobs in
  # 64 seconds — before compiling anything — because Cargo.lock had resolved
  # tauri-plugin-opener 2.7.2 next to @tauri-apps/plugin-opener 2.5.5.
  #
  # The script compares the two lockfiles, so this job needs no install, no
  # Rust toolchain and no network: checkout plus node, a few seconds.
  tauri-plugins:
    name: tauri plugin versions pair up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust crate and JS wrapper agree on major.minor
        run: node scripts/check-tauri-plugin-versions.mjs

  # ── Rust dependency graph ────────────────────────────────────────────────
  # Nothing in CI used to open src-tauri/Cargo.lock, so a dependency added to
  # src-tauri/Cargo.toml could sit unlocked for as long as nobody noticed: the
  # release workflow runs `cargo build` without --locked, which quietly resolves
  # whatever the manifest asks for, and every package built from that tag then
  # differs from the reviewed commit. The lock did drift that far — it described
  # a root package with no Tauri plugins at all while the manifest depended on
  # six of them.
  #
  # `cargo metadata --locked` resolves the whole graph and refuses to write the
  # lock, so it fails on exactly that mistake: a manifest the committed lock
  # does not already describe. It compiles nothing — no WebKit or GTK packages
  # — it only reads the crates.io index.
  rust-lockfile:
    name: rust lockfile matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo metadata --locked resolves the crate graph
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null

  # ── Reproducible frontend ─────────────────────────────────────────────────
  # Every release package embeds dist/, so two builds of one commit must be
  # byte-identical or a local build can never be compared with a shipped
  # artifact. Each runner below builds dist/ twice into separate directories
  # and fails on a single differing byte; reproducible-cross-os then asserts
  # the Windows and Linux results are identical to each other.
  #
  # A developer reproduces this locally with `npm run repro`, which prints the
  # same rootHash that the release publishes in repro-manifest.json.
  reproducible-frontend:
    name: reproducible frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build twice and compare the bytes
        run: node scripts/repro-build.mjs

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: repro-${{ matrix.os }}
          path: |
            .repro/manifest.json
            .repro/SHA256SUMS
          if-no-files-found: error

  reproducible-cross-os:
    name: reproducible cross-OS
    needs: reproducible-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # download-artifact places each artifact in its own directory, so the
      # two manifests cannot overwrite one another.
      - uses: actions/download-artifact@v4
        with:
          pattern: repro-*
          path: .repro-matrix

      - name: Compare the Windows and Linux builds
        run: |
          node scripts/build-manifest.mjs --compare \
            .repro-matrix/repro-ubuntu-latest/manifest.json \
            .repro-matrix/repro-windows-latest/manifest.json
